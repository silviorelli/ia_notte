<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0c0a09">
  <title>IA notte</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    input[type="range"] { accent-color: #d97706; }
  </style>
</head>
<body class="bg-stone-950 text-amber-50 min-h-screen antialiased">
  <main class="max-w-md mx-auto px-4 py-6 pb-16">

    <header class="flex items-center gap-3 mb-8">
      <button id="home-btn" aria-label="Torna alla pagina iniziale"
              class="hidden rounded-xl bg-stone-800 active:bg-stone-700 border border-stone-700
                     px-4 py-3 text-lg font-semibold text-amber-100">
        <span class="flex items-center gap-2">
          <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"
               aria-hidden="true"><path d="M19 12H5m7-7-7 7 7 7"/></svg>
          Indietro
        </span>
      </button>
      <svg class="w-9 h-9 text-amber-300" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <h1 class="text-3xl font-bold text-amber-200 tracking-wide">IA notte</h1>
    </header>

    <section id="view-picker">
      <h2 class="text-lg text-amber-100/80 mb-3">Scegli il personaggio</h2>
      <div id="preset-grid" class="grid grid-cols-2 gap-3 mb-8"></div>

      <label for="custom-character" class="block text-lg text-amber-100/80 mb-2">
        Oppure scrivilo tu
      </label>
      <input id="custom-character" type="text" autocomplete="off" enterkeyhint="go"
             maxlength="20" placeholder="Es. un riccio timido"
             class="w-full rounded-2xl bg-stone-900 border border-stone-700 px-5 py-4 text-xl
                    text-amber-50 placeholder-stone-500 mb-3
                    focus:outline-none focus:border-amber-600">
      <button id="generate-btn"
              class="w-full rounded-2xl bg-amber-700 active:bg-amber-600 px-5 py-5 text-xl
                     font-semibold text-amber-50 shadow-lg">
        Genera storia
      </button>

      <section id="recent-section" class="mt-10 hidden">
        <h2 class="text-lg text-amber-100/80 mb-3">Storie recenti</h2>
        <div id="recent-list" class="flex flex-col gap-2"></div>
      </section>
    </section>

    <section id="view-loading" class="hidden text-center py-16">
      <svg class="w-20 h-20 mx-auto mb-6 text-amber-300 animate-pulse" viewBox="0 0 24 24"
           fill="currentColor" aria-hidden="true">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <p id="loading-message" class="text-2xl text-amber-100"></p>
      <p class="text-amber-100/50 mt-3 text-lg">Pochi secondi...</p>
    </section>

    <section id="view-error" class="hidden text-center py-12">
      <p id="error-message" class="text-xl text-red-300 mb-8"></p>
      <button id="retry-btn"
              class="w-full rounded-2xl bg-amber-700 active:bg-amber-600 px-5 py-5 text-xl
                     font-semibold text-amber-50 mb-3">
        Riprova
      </button>
      <button id="error-back-btn"
              class="w-full rounded-2xl bg-stone-800 active:bg-stone-700 px-5 py-4 text-lg
                     text-amber-100 border border-stone-700">
        Torna all'inizio
      </button>
    </section>

    <section id="view-story" class="hidden">
      <h2 id="story-title" class="text-2xl font-bold text-amber-200 mb-5"></h2>

      <div class="bg-stone-900 rounded-2xl p-5 mb-6 border border-stone-800">
        <div class="flex justify-center mb-2">
          <button id="play-btn" aria-label="Riproduci o metti in pausa"
                  class="w-24 h-24 rounded-full bg-amber-600 active:bg-amber-500 shadow-lg
                         flex items-center justify-center text-stone-950
                         disabled:opacity-40 disabled:active:bg-amber-600">
            <svg id="icon-play" class="w-12 h-12 ml-1" viewBox="0 0 24 24" fill="currentColor"
                 aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
            <svg id="icon-pause" class="w-12 h-12 hidden" viewBox="0 0 24 24" fill="currentColor"
                 aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
          </button>
        </div>
        <p id="voice-status" class="text-center text-amber-100/60 text-base mb-4 min-h-6"></p>

        <div id="chapters-section" class="hidden mb-4">
          <p class="text-lg text-amber-100/80 mb-2">Capitoli</p>
          <div id="chapters-row" class="flex flex-wrap gap-2"></div>
        </div>

        <div class="mb-4">
          <input id="seek-slider" type="range" min="0" max="0" step="0.1" value="0"
                 class="w-full h-10" aria-label="Posizione">
          <div class="flex justify-between text-sm text-amber-100/50 -mt-1">
            <span id="current-time">0:00</span>
            <span id="total-time">0:00</span>
          </div>
        </div>

        <div class="flex items-center justify-between mb-2">
          <label for="speed-slider" class="text-lg text-amber-100/80">Velocità</label>
          <span id="speed-label" class="text-2xl font-semibold text-amber-200"></span>
        </div>
        <input id="speed-slider" type="range" min="0.8" max="1.4" step="0.1"
               class="w-full h-10">

        <div class="flex items-center justify-between mb-2 mt-3">
          <label for="volume-slider" class="text-lg text-amber-100/80">Volume</label>
          <span id="volume-label" class="text-2xl font-semibold text-amber-200"></span>
        </div>
        <input id="volume-slider" type="range" min="0" max="1" step="0.05"
               class="w-full h-10">

        <audio id="audio" preload="metadata" class="hidden"></audio>
      </div>

      <article id="story-text"
               class="text-xl leading-relaxed text-amber-50/90 whitespace-pre-line mb-8"></article>

      <div class="flex flex-col gap-3">
        <button id="new-story-btn"
                class="w-full rounded-2xl bg-amber-700 active:bg-amber-600 px-5 py-5 text-xl
                       font-semibold text-amber-50">
          Nuova storia
        </button>
        <button id="back-btn"
                class="w-full rounded-2xl bg-stone-800 active:bg-stone-700 px-5 py-4 text-lg
                       text-amber-100 border border-stone-700">
          Cambia personaggio
        </button>
      </div>
    </section>

  </main>

  <script>
    "use strict";

    const el = (id) => document.getElementById(id);
    const VIEWS = ["picker", "loading", "error", "story"];
    const SPEED_KEY = "ia-notte-speed";
    const VOLUME_KEY = "ia-notte-volume";
    const POLL_INTERVAL_MS = 2000;
    const CHAPTER_GAP_MS = 1000;
    const state = {
      character: null,
      record: null,
      mode: "full",          // "full": file completo | "parts": blocchi progressivi
      currentChapter: 0,
      waitingNext: false,    // playback fermo in attesa del capitolo successivo
      playbackStarted: false,
      pollTimer: null,
      advanceTimer: null,    // pausa di 1s tra un capitolo e il successivo
      seeking: false,
    };

    function showView(name) {
      VIEWS.forEach((v) => el("view-" + v).classList.toggle("hidden", v !== name));
      el("home-btn").classList.toggle("hidden", name === "picker");
      window.scrollTo(0, 0);
    }

    const STORY_PATH = /^\/storia\/([0-9a-f]{12})$/;

    function setUrl(path) {
      if (location.pathname !== path) {
        history.pushState({}, "", path);
      }
    }

    async function fetchJson(url, options) {
      const response = await fetch(url, options);
      if (!response.ok) {
        const body = await response.json().catch(() => ({}));
        throw new Error(body.detail || "Errore di comunicazione con il server");
      }
      return response.json();
    }

    function bigButton(label, onClick) {
      const button = document.createElement("button");
      button.textContent = label;
      button.className = "rounded-2xl bg-stone-800 active:bg-amber-800 border border-stone-700 " +
        "px-4 py-6 text-xl font-semibold text-amber-100 shadow";
      button.addEventListener("click", onClick);
      return button;
    }

    function renderPresets(characters) {
      const grid = el("preset-grid");
      grid.replaceChildren(...characters.map((c) => bigButton(c, () => generate(c))));
    }

    async function loadRecent() {
      try {
        const stories = await fetchJson("/api/stories");
        el("recent-section").classList.toggle("hidden", stories.length === 0);
        const formatter = new Intl.DateTimeFormat("it-IT",
          { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
        el("recent-list").replaceChildren(...stories.map((story) => {
          const button = document.createElement("button");
          button.className = "w-full rounded-xl bg-stone-900 active:bg-stone-800 border " +
            "border-stone-800 px-4 py-4 text-left flex justify-between items-center gap-3";
          const name = document.createElement("span");
          name.textContent = story.character + (story.status === "error" ? " (senza voce)" : "");
          name.className = "text-lg font-semibold text-amber-100";
          const date = document.createElement("span");
          date.textContent = formatter.format(new Date(story.created_at));
          date.className = "text-sm text-amber-100/50 shrink-0";
          button.append(name, date);
          button.addEventListener("click", () => openStory(story.id));
          return button;
        }));
      } catch (error) {
        console.error("Impossibile caricare le storie recenti:", error);
      }
    }

    async function generate(character) {
      state.character = character;
      el("loading-message").textContent = "Sto scrivendo la storia di " + character + "...";
      showView("loading");
      try {
        const record = await fetchJson("/api/stories", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ character }),
        });
        setUrl("/storia/" + record.id);
        showStory(record);
        loadRecent();
      } catch (error) {
        el("error-message").textContent = error.message;
        showView("error");
      }
    }

    async function openStory(id, updateUrl = true) {
      try {
        const record = await fetchJson("/api/stories/" + id);
        if (updateUrl) {
          setUrl("/storia/" + record.id);
        }
        showStory(record);
      } catch (error) {
        el("error-message").textContent = error.message;
        showView("error");
      }
    }

    function partUrl(record, index) {
      return "/api/stories/" + record.id + "/audio/" + index;
    }

    function stopPolling() {
      if (state.pollTimer) {
        clearInterval(state.pollTimer);
        state.pollTimer = null;
      }
    }

    function cancelPendingAdvance() {
      if (state.advanceTimer) {
        clearTimeout(state.advanceTimer);
        state.advanceTimer = null;
      }
    }

    function setVoiceStatus(message) {
      el("voice-status").textContent = message;
    }

    function setPlayEnabled(enabled) {
      el("play-btn").disabled = !enabled;
    }

    function partsDone() {
      return new Set(state.record && state.record.parts_done || []);
    }

    function showStory(record) {
      stopPolling();
      cancelPendingAdvance();
      const audio = el("audio");
      audio.pause();
      audio.removeAttribute("src");
      state.character = record.character;
      state.record = record;
      state.currentChapter = 0;
      state.waitingNext = false;
      state.playbackStarted = false;
      state.seeking = false;
      el("story-title").textContent = "La storia di " + record.character;
      el("story-text").textContent = record.story;
      document.title = "IA notte - " + record.character;
      resetSeekBar();
      showView("story");

      if (record.status === "ready") {
        state.mode = "full";
        audio.src = record.audio_url;
        setPlayEnabled(true);
        setVoiceStatus("");
      } else if (record.status === "error") {
        state.mode = "full";
        setPlayEnabled(false);
        setVoiceStatus("La voce non è disponibile per questa storia.");
      } else {
        state.mode = "parts";
        if (record.chunks_ready > 0) {
          loadPart(0, false);
        } else {
          setPlayEnabled(false);
          setVoiceStatus("Sto preparando la voce...");
        }
        state.pollTimer = setInterval(pollRecord, POLL_INTERVAL_MS);
      }
      renderChapters();
    }

    function loadPart(index, autoplay) {
      cancelPendingAdvance();
      const audio = el("audio");
      state.currentChapter = index;
      audio.src = partUrl(state.record, index);
      setPlayEnabled(true);
      updateVoiceProgress();
      renderChapters();
      if (autoplay) {
        audio.play().catch((error) => {
          console.error("Riproduzione automatica bloccata:", error);
        });
      }
    }

    function selectChapter(index) {
      const audio = el("audio");
      if (state.mode === "parts") {
        if (!partsDone().has(index)) { return; }
        state.waitingNext = false;
        loadPart(index, true);
        return;
      }
      const offsets = state.record.chapter_offsets;
      if (!offsets || offsets[index] === undefined) { return; }
      cancelPendingAdvance();
      state.currentChapter = index;
      audio.currentTime = offsets[index];
      renderChapters();
      audio.play().catch((error) => {
        console.error("Riproduzione bloccata:", error);
      });
    }

    function chapterChip(index, ready, current, spinning) {
      const button = document.createElement("button");
      button.disabled = !ready;
      const base = "min-w-12 px-4 py-3 rounded-xl text-lg font-semibold " +
        "flex items-center justify-center gap-2 ";
      if (current) {
        button.className = base + "bg-amber-600 text-stone-950";
      } else if (ready) {
        button.className = base + "bg-stone-800 text-amber-100 border border-stone-700 " +
          "active:bg-amber-800";
      } else {
        button.className = base + "bg-stone-800/50 text-amber-100/40 border border-stone-800";
      }
      const label = document.createElement("span");
      label.textContent = String(index + 1);
      button.append(label);
      if (spinning) {
        const spinner = document.createElement("span");
        spinner.innerHTML =
          '<svg class="animate-spin w-5 h-5" viewBox="0 0 24 24" fill="none" aria-hidden="true">' +
          '<circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" ' +
          'class="opacity-25"></circle>' +
          '<path d="M22 12a10 10 0 0 1-10 10" stroke="currentColor" stroke-width="4" ' +
          'stroke-linecap="round"></path></svg>';
        button.append(spinner);
        button.setAttribute("aria-label", "Capitolo " + (index + 1) + " in preparazione");
      }
      button.addEventListener("click", () => selectChapter(index));
      return button;
    }

    function renderChapters() {
      const record = state.record;
      const section = el("chapters-section");
      const total = record ? record.chunks_total || 1 : 1;
      const generating = record && record.status === "generating";
      const hasOffsets = record && Array.isArray(record.chapter_offsets);
      if (!record || total <= 1 || (state.mode === "full" && !hasOffsets)) {
        section.classList.add("hidden");
        return;
      }
      section.classList.remove("hidden");
      const done = partsDone();
      const chips = [];
      for (let index = 0; index < total; index++) {
        const ready = state.mode === "full" || done.has(index);
        chips.push(chapterChip(index, ready, index === state.currentChapter,
          !ready && generating));
      }
      el("chapters-row").replaceChildren(...chips);
    }

    function updateVoiceProgress() {
      const record = state.record;
      if (record.status !== "generating" || state.mode !== "parts") {
        setVoiceStatus("");
        return;
      }
      if (record.rate_limited) {
        setVoiceStatus("Troppe richieste al server, potrebbe volerci qualche secondo in più...");
        return;
      }
      if (record.chunks_ready === 0) {
        setVoiceStatus("Sto preparando la voce...");
        return;
      }
      setVoiceStatus("Voce: capitolo " + (state.currentChapter + 1) + " di " +
        record.chunks_total + (state.waitingNext ? " (preparo il prossimo...)" : ""));
    }

    async function pollRecord() {
      if (!state.record) { return; }
      let record;
      try {
        record = await fetchJson("/api/stories/" + state.record.id);
      } catch (error) {
        console.error("Aggiornamento stato non riuscito:", error);
        return;
      }
      state.record = record;
      const audio = el("audio");

      if (state.mode === "parts" && record.chunks_ready > 0 && !audio.getAttribute("src")) {
        loadPart(0, false);
      }
      if (state.waitingNext && partsDone().has(state.currentChapter + 1)) {
        state.waitingNext = false;
        loadPart(state.currentChapter + 1, true);
      }
      updateVoiceProgress();
      renderChapters();

      if (record.status === "generating") { return; }
      stopPolling();
      if (record.status === "ready") {
        if (state.mode === "parts" && !state.playbackStarted) {
          state.mode = "full";
          audio.src = record.audio_url;
          setPlayEnabled(true);
        }
        setVoiceStatus("");
        renderChapters();
        loadRecent();
      } else if (record.status === "error") {
        setVoiceStatus(record.chunks_ready > 0
          ? "La voce si è interrotta: è disponibile solo l'inizio."
          : "La voce non è disponibile, ma puoi leggere la storia.");
        if (record.chunks_ready === 0) { setPlayEnabled(false); }
        renderChapters();
        loadRecent();
      }
    }

    function onAudioEnded() {
      if (state.mode !== "parts" || !state.record) { return; }
      const next = state.currentChapter + 1;
      if (next >= state.record.chunks_total) { return; }
      if (partsDone().has(next)) {
        cancelPendingAdvance();
        state.advanceTimer = setTimeout(() => {
          state.advanceTimer = null;
          loadPart(next, true);
        }, CHAPTER_GAP_MS);
      } else if (state.record.status === "generating") {
        state.waitingNext = true;
        updateVoiceProgress();
      }
    }

    function updateFullModeChapter() {
      const offsets = state.record && state.record.chapter_offsets;
      if (!offsets) { return; }
      const position = el("audio").currentTime + 0.01;
      let chapter = 0;
      for (let index = 0; index < offsets.length; index++) {
        if (offsets[index] <= position) { chapter = index; }
      }
      if (chapter !== state.currentChapter) {
        state.currentChapter = chapter;
        renderChapters();
      }
    }

    function formatTime(seconds) {
      if (!Number.isFinite(seconds) || seconds < 0) { return "0:00"; }
      const minutes = Math.floor(seconds / 60);
      const rest = String(Math.floor(seconds % 60)).padStart(2, "0");
      return minutes + ":" + rest;
    }

    function resetSeekBar() {
      el("seek-slider").value = "0";
      el("seek-slider").max = "0";
      el("current-time").textContent = "0:00";
      el("total-time").textContent = "0:00";
    }

    function applySpeed() {
      const value = parseFloat(el("speed-slider").value);
      el("speed-label").textContent = value.toFixed(1).replace(".", ",") + "x";
      const audio = el("audio");
      audio.playbackRate = value;
      audio.defaultPlaybackRate = value;
      localStorage.setItem(SPEED_KEY, String(value));
    }

    function applyVolume() {
      const value = parseFloat(el("volume-slider").value);
      el("volume-label").textContent = Math.round(value * 100) + "%";
      el("audio").volume = value;
      localStorage.setItem(VOLUME_KEY, String(value));
    }

    function initAudioControls() {
      const audio = el("audio");
      const seek = el("seek-slider");
      el("play-btn").addEventListener("click", () => {
        cancelPendingAdvance();
        if (audio.paused) { audio.play(); } else { audio.pause(); }
      });
      const setIcon = (playing) => {
        el("icon-play").classList.toggle("hidden", playing);
        el("icon-pause").classList.toggle("hidden", !playing);
      };
      audio.addEventListener("play", () => {
        state.playbackStarted = true;
        setIcon(true);
      });
      audio.addEventListener("pause", () => setIcon(false));
      audio.addEventListener("ended", () => {
        setIcon(false);
        onAudioEnded();
      });
      audio.addEventListener("loadedmetadata", () => {
        seek.max = String(audio.duration);
        el("total-time").textContent = formatTime(audio.duration);
        applySpeed();
        applyVolume();
      });
      audio.addEventListener("timeupdate", () => {
        if (!state.seeking) { seek.value = String(audio.currentTime); }
        el("current-time").textContent = formatTime(audio.currentTime);
        if (state.mode === "full") { updateFullModeChapter(); }
      });
      seek.addEventListener("pointerdown", () => { state.seeking = true; });
      seek.addEventListener("input", () => {
        audio.currentTime = parseFloat(seek.value);
      });
      seek.addEventListener("change", () => { state.seeking = false; });
      el("speed-slider").addEventListener("input", applySpeed);
      el("volume-slider").addEventListener("input", applyVolume);
    }

    function initButtons() {
      const customInput = el("custom-character");
      const generateCustom = () => {
        const character = customInput.value.trim();
        if (character) { generate(character); }
      };
      el("generate-btn").addEventListener("click", generateCustom);
      customInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") { generateCustom(); }
      });
      el("new-story-btn").addEventListener("click", () => generate(state.character));
      el("retry-btn").addEventListener("click", () => {
        if (state.character) { generate(state.character); } else { goHome(); }
      });
      el("home-btn").addEventListener("click", goHome);
      el("back-btn").addEventListener("click", goHome);
      el("error-back-btn").addEventListener("click", goHome);
    }

    function showPicker() {
      stopPolling();
      cancelPendingAdvance();
      el("audio").pause();
      document.title = "IA notte";
      showView("picker");
    }

    function goHome() {
      showPicker();
      setUrl("/");
    }

    function handleRoute() {
      const match = location.pathname.match(STORY_PATH);
      if (match) {
        openStory(match[1], false);
      } else {
        showPicker();
      }
    }

    async function init() {
      initAudioControls();
      initButtons();
      let defaultRate = 1.0;
      try {
        const cfg = await fetchJson("/api/config");
        defaultRate = cfg.default_playback_rate;
        renderPresets(cfg.characters);
      } catch (error) {
        console.error("Impossibile caricare la configurazione:", error);
      }
      const savedSpeed = parseFloat(localStorage.getItem(SPEED_KEY));
      const clamped = Math.min(1.4, Math.max(0.8, savedSpeed));
      const speed = Number.isFinite(savedSpeed) ? Math.round(clamped * 10) / 10 : defaultRate;
      el("speed-slider").value = String(speed);
      applySpeed();
      const savedVolume = parseFloat(localStorage.getItem(VOLUME_KEY));
      const volume = Number.isFinite(savedVolume) ? Math.min(1, Math.max(0, savedVolume)) : 1;
      el("volume-slider").value = String(volume);
      applyVolume();
      loadRecent();
      window.addEventListener("popstate", handleRoute);
      handleRoute();
    }

    init();
  </script>
</body>
</html>
